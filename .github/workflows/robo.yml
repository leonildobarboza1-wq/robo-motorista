name: Rodar Robo Emprego Motorista

on:
  schedule:
    # Programado para rodar todos os dias às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite que você aperte um botão para rodar na hora que quiser

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando os arquivos do seu GitHub
      uses: actions/checkout@v4

    - name: Instalando o Python na Nuvem
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalando as bibliotecas necessárias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-genai lxml google-api-python-client

    - name: Executando o Robô Principal
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: python main.py
