name: Robô Motorista Blogger

on:
  schedule:
    - cron: '0 */4 * * *' # Roda a cada 4 horas
  workflow_dispatch: # Permite execução manual no painel do GitHub

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    - name: Executar Script Principal
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      run: python main.py
